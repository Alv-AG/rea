name: ChatGPT Actions policy probe
# policy-probe: after correctly saving selected-actions allowlist

on:
  push:
    branches:
      - chatgpt/actions-policy-probe

permissions:
  contents: read

jobs:
  external-action-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: External pinned action expected to be blocked by allowlist
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
